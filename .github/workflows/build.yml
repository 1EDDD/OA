name: Build SpotifyLocalFiles

on:
  push:
    branches:
      - main
      - spotify-local-files
    paths:
      - "SpotifyLocalFiles/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Theos and SDKs
        run: |
          set -euxo pipefail
          brew install ldid make
          PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          git clone --depth 1 --recursive https://github.com/theos/theos theos
          mkdir -p theos/sdks
          cd theos/sdks
          curl -L --fail -o master.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          TMP=$(mktemp -d)
          unzip -q master.zip -d "$TMP"
          mv "$TMP"/*-master/*.sdk .
          rm -rf master.zip "$TMP"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Build tweak
        working-directory: SpotifyLocalFiles
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Collect LiveContainer files
        working-directory: SpotifyLocalFiles
        run: |
          set -eux
          mkdir -p ../release
          find .theos -type f -name "SpotifyLocalFiles.dylib" -print -exec cp {} ../release/SpotifyLocalFiles.dylib \;
          cp SpotifyLocalFiles.plist ../release/SpotifyLocalFiles.plist
          test -s ../release/SpotifyLocalFiles.dylib
          ls -lh ../release

      - name: Upload LiveContainer files
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyLocalFiles-LiveContainer
          path: release/*

      - name: Upload Theos package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyLocalFiles-package
          path: SpotifyLocalFiles/packages/*
